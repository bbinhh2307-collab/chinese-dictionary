<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOE Style Hán-Việt Dictionary</title>
<style>
*{ margin:0; padding:0; box-sizing:border-box; }
body{ font-family:Arial, Helvetica, sans-serif; background:#f3f6fb; color:#1e293b; line-height:1.8; }

/* HEADER */
.header{ position:sticky; top:0; z-index:100; background:rgba(255,255,255,.95); backdrop-filter:blur(10px); padding:18px 40px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #e2e8f0; }
.logo{ font-size:28px; font-weight:800; letter-spacing:1px; color:#0f172a; }
.search{ width:420px; }
.search input{ width:100%; padding:14px 18px; border:none; border-radius:18px; background:#eef2f7; font-size:15px; outline:none; transition:.25s; }
.search input:focus{ background:#fff; box-shadow:0 0 0 4px rgba(59,130,246,.15); }

/* LAYOUT */
.container{ max-width:1400px; margin:auto; padding:35px; display:grid; grid-template-columns:260px 1fr; gap:30px; }
.sidebar{ background:#fff; padding:25px; border-radius:28px; height:fit-content; box-shadow:0 10px 30px rgba(0,0,0,.04); }
.sidebar h3{ margin-bottom:20px; font-size:18px; }
.menu{ display:flex; flex-direction:column; gap:12px; }
.menu button{ border:none; padding:14px; border-radius:14px; background:#f1f5f9; cursor:pointer; font-size:15px; transition:.2s; text-align:left; }
.menu button:hover{ background:#dbeafe; color:#2563eb; }

/* MAIN */
.main{ display:flex; flex-direction:column; gap:30px; }
.card{ background:#fff; padding:40px; border-radius:34px; box-shadow:0 15px 35px rgba(0,0,0,.05); transition:.25s; }
.wordTop{ margin-bottom:30px; }
.hanzi{ font-size:100px; font-weight:800; line-height:1; font-family:"Times New Roman", serif; color:#0f172a; display:flex; align-items:center; gap:15px; }

/* STROKE ORDER BOX */
.stroke-box { margin-top: 20px; border-radius: 20px; overflow: hidden; border: 1px solid #e2e8f0; background: #fff; }
.stroke-box iframe { width: 100%; height: 300px; border: none; }

.meta{ margin-top:18px; display:flex; flex-wrap:wrap; gap:12px; font-size:14px; color:#64748b; }
.badge{ background:#eff6ff; color:#2563eb; padding:6px 12px; border-radius:999px; font-weight:600; }
.section{ margin-top:35px; }
.sectionTitle{ font-size:22px; font-weight:700; margin-bottom:20px; padding-left:14px; border-left:5px solid #2563eb; }
.meaning{ background:#f8fafc; padding:22px; border-radius:22px; margin-bottom:18px; }
.cn{ margin-top:10px; color:#475569; }
.example{ margin-top:16px; background:#fff; padding:18px; border-radius:16px; border:1px solid #e2e8f0; }
.pinyin{ margin-top:8px; color:#2563eb; font-style:italic; }
.vi{ margin-top:8px; font-weight:500; }
.wordList{ display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
.tag{ padding:9px 15px; background:#f1f5f9; border-radius:999px; font-size:14px; cursor:pointer; transition:.2s; }
.tag:hover{ background:#dbeafe; color:#2563eb; }

/* AUDIO ICON */
.speaker{ cursor: pointer; color: #2563eb; display: inline-flex; align-items: center; vertical-align: middle; transition: 0.2s; }
.speaker:hover{ transform: scale(1.1); }
.hanzi .speaker svg { width: 48px; height: 48px; }
.example .speaker svg { width: 20px; height: 20px; margin-right: 6px; }

@media(max-width:980px){ .container{ grid-template-columns:1fr; padding:18px; } .hanzi{ font-size:72px; } .card{ padding:28px; } }
</style>
</head>
<body>

<header class="header">
    <div class="logo">華越詞典</div>
    <div class="search"><input type="text" placeholder="搜尋漢字..."></div>
</header>

<div class="container">
    <aside class="sidebar">
        <h3>功能選單</h3>
        <div class="menu">
            <button>📘 HSK 詞彙</button>
            <button>📗 TOCFL 詞彙</button>
            <button>⭐ 我的收藏</button>
            <button>🕘 最近查詢</button>
        </div>
    </aside>

    <main class="main">
        <!-- LÃO -->
        <div class="card">
            <div class="wordTop">
                <div class="hanzi">
                    <span class="speaker" onclick="play('老')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.85 14,18.71V20.77C18.03,19.86 21,16.28 21,12C21,7.72 18.03,4.14 14,3.23M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16.02C15.5,15.29 16.5,13.77 16.5,12M3,9V15H7L12,20V4L7,9H3Z"/></svg></span>
                    老
                </div>
                <div class="meta">
                    <span>ㄌㄠˇ</span><span>lǎo</span><span>lão</span>
                    <span class="badge">HSK 1</span>
                </div>
                <div class="stroke-box">
                    <iframe src="https://stroke-order.learningweb.moe.edu.tw/strokeStateless.do?w=老&m=flash" scrolling="no"></iframe>
                </div>
            </div>

            <div class="section">
                <div class="sectionTitle">形容詞</div>
                <div class="meaning">
                    <b>① Lớn tuổi, trái nghĩa với “trẻ”</b>
                    <div class="cn">年紀大，與「少」相對。</div>
                    <div class="example">
                        <div><span class="speaker" onclick="play('他的父母已经很老了')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.85 14,18.71V20.77C18.03,19.86 21,16.28 21,12C21,7.72 18.03,4.14 14,3.23M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16.02C15.5,15.29 16.5,13.77 16.5,12M3,9V15H7L12,20V4L7,9H3Z"/></svg></span>他的父母已经很老了。</div>
                        <div class="pinyin">Tā de fùmǔ yǐjīng hěn lǎo le.</div>
                        <div class="vi">→ Bố mẹ anh ấy đã rất già rồi.</div>
                    </div>
                </div>
            </div>
            <!-- Giữ nguyên các phần giải nghĩa khác như code trước... -->
        </div>

        <!-- 便宜 -->
        <div class="card">
            <div class="wordTop">
                <div class="hanzi">
                    <span class="speaker" onclick="play('便宜')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.85 14,18.71V20.77C18.03,19.86 21,16.28 21,12C21,7.72 18.03,4.14 14,3.23M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16.02C15.5,15.29 16.5,13.77 16.5,12M3,9V15H7L12,20V4L7,9H3Z"/></svg></span>
                    便宜
                </div>
                <div class="stroke-box">
                    <!-- Ghép 2 chữ bằng cách dùng 2 iframe nhỏ -->
                    <div style="display:flex;">
                        <iframe src="https://stroke-order.learningweb.moe.edu.tw/strokeStateless.do?w=便&m=flash" style="width:50%;"></iframe>
                        <iframe src="https://stroke-order.learningweb.moe.edu.tw/strokeStateless.do?w=宜&m=flash" style="width:50%;"></iframe>
                    </div>
                </div>
            </div>
            <div class="section">
                <div class="sectionTitle">形容詞</div>
                <div class="meaning">
                    <b>① Giá thấp / rẻ</b>
                    <div class="example">
                        <div><span class="speaker" onclick="play('這件衣服很便宜')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.85 14,18.71V20.77C18.03,19.86 21,16.28 21,12C21,7.72 18.03,4.14 14,3.23M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16.02C15.5,15.29 16.5,13.77 16.5,12M3,9V15H7L12,20V4L7,9H3Z"/></svg></span>這件衣服很便宜。</div>
                        <div class="pinyin">Zhè jiàn yīfu hěn piányi.</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 麻煩 -->
        <div class="card">
            <div class="wordTop">
                <div class="hanzi">
                    <span class="speaker" onclick="play('麻煩')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.85 14,18.71V20.77C18.03,19.86 21,16.28 21,12C21,7.72 18.03,4.14 14,3.23M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16.02C15.5,15.29 16.5,13.77 16.5,12M3,9V15H7L12,20V4L7,9H3Z"/></svg></span>
                    麻煩
                </div>
                <div class="stroke-box">
                    <div style="display:flex;">
                        <iframe src="https://stroke-order.learningweb.moe.edu.tw/strokeStateless.do?w=麻&m=flash" style="width:50%;"></iframe>
                        <iframe src="https://stroke-order.learningweb.moe.edu.tw/strokeStateless.do?w=煩&m=flash" style="width:50%;"></iframe>
                    </div>
                </div>
            </div>
            <div class="section">
                <div class="sectionTitle">形容詞</div>
                <div class="meaning">
                    <b>① Phiền phức</b>
                    <div class="example">
                        <div><span class="speaker" onclick="play('這個程序太麻煩了')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.85 14,18.71V20.77C18.03,19.86 21,16.28 21,12C21,7.72 18.03,4.14 14,3.23M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16.02C15.5,15.29 16.5,13.77 16.5,12M3,9V15H7L12,20V4L7,9H3Z"/></svg></span>這個程序太麻煩了。</div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
function play(text) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'zh-CN';
    utterance.rate = 0.85;
    window.speechSynthesis.speak(utterance);
}
</script>

</body>
</html>

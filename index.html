<!DOCTYPE html>
<html lang="vi">
<head>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOE Style Hán-Việt Dictionary</title>
    <style>
        /* --- GIỮ NGUYÊN STYLE GỐC CỦA BẠN --- */
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:Arial, Helvetica, sans-serif; background:#f3f6fb; color:#1e293b; line-height:1.8; }
        .header { position:sticky; top:0; z-index:100; background:rgba(255,255,255,.95); backdrop-filter:blur(10px); padding:18px 40px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #e2e8f0; }
        .logo { font-size:28px; font-weight:800; letter-spacing:1px; color:#0f172a; }
        
        /* Thanh tìm kiếm có nút */
        .search { width:420px; display: flex; gap: 8px; background:#eef2f7; padding: 6px 10px; border-radius: 18px; }
        .search input { flex: 1; border:none; background:transparent; padding:8px; font-size:15px; outline:none; }
        .search-btn { background:#2563eb; color:white; border:none; padding:8px 18px; border-radius:14px; cursor:pointer; font-weight:bold; }
        .search-btn:hover { background:#1d4ed8; }

        .container { max-width:1400px; margin:auto; padding:35px; display:grid; grid-template-columns:260px 1fr; gap:30px; }
        .sidebar { background:#fff; padding:25px; border-radius:28px; height:fit-content; box-shadow:0 10px 30px rgba(0,0,0,.04); }
        .sidebar h3 { margin-bottom:20px; font-size:18px; }
        .menu { display:flex; flex-direction:column; gap:12px; }
        .menu button { border:none; padding:14px; border-radius:14px; background:#f1f5f9; cursor:pointer; font-size:15px; text-align:left; }
        .menu button:hover { background:#dbeafe; color:#2563eb; }

        .main { display:flex; flex-direction:column; gap:30px; }
        .card { background:#fff; padding:40px; border-radius:34px; box-shadow:0 15px 35px rgba(0,0,0,.05); }
        .wordTop { margin-bottom:30px; }
        .hanzi { font-size:100px; font-weight:800; line-height:1; font-family:"Times New Roman", serif; color:#0f172a; display: flex; align-items: center; gap: 15px; }
        .stroke-container { margin-top: 20px; display: flex; gap: 15px; flex-wrap: wrap; }
        .stroke-box { width: 160px; height: 160px; border-radius: 18px; border: 2px solid #eef2f7; background: #fff; }
        .meta { margin-top:18px; display:flex; flex-wrap:wrap; gap:12px; font-size:14px; color:#64748b; }
        .badge { background:#eff6ff; color:#2563eb; padding:6px 12px; border-radius:999px; font-weight:600; }
        .section { margin-top:35px; }
        .sectionTitle { font-size:22px; font-weight:700; margin-bottom:20px; padding-left:14px; border-left:5px solid #2563eb; }
        .meaning { background:#f8fafc; padding:22px; border-radius:22px; margin-bottom:18px; }
        .cn { margin-top:10px; color:#475569; }
        .example { margin-top:16px; background:#fff; padding:18px; border-radius:16px; border:1px solid #e2e8f0; }
        .pinyin { margin-top:8px; color:#2563eb; font-style:italic; }
        .vi { margin-top:8px; font-weight:500; }
        .wordList { display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
        .tag { padding:9px 15px; background:#f1f5f9; border-radius:999px; font-size:14px; cursor:pointer; }
        .tag:hover { background:#dbeafe; color:#2563eb; }
        .speaker { cursor: pointer; color: #2563eb; }
        .speaker svg { width: 48px; height: 48px; vertical-align: middle; }
        .empty-state { text-align: center; padding: 100px 20px; color: #94a3b8; }
        .btn-stroke-trigger { margin-top:15px; padding:8px 16px; border:1px solid #2563eb; background:transparent; color:#2563eb; border-radius:8px; cursor:pointer; font-weight:bold;}

        @media(max-width:980px){
            .container{ grid-template-columns:1fr; padding:18px; }
            .search{ width:100%; }
            .hanzi{ font-size:72px; }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="logo">華越詞典</div>
    <div class="search">
        <input type="text" id="searchInput" placeholder="搜尋漢字 / 拼音 / 漢越音...">
        <button class="search-btn" onclick="performSearch()">Tìm kiếm 搜尋</button>
    </div>
</header>

<div class="container">
    <aside class="sidebar">
        <h3>功能選單</h3>
        <div class="menu">
            <button>⭐ 我的收藏</button>
        </div>
    </aside>

    <main class="main" id="mainContent">
        <div class="empty-state">
            <h2>歡迎使用華越詞典</h2>
            <p>Vui lòng nhập từ vựng (ví dụ: <b>老</b>, <b>便宜</b>, <b>麻煩</b>) và nhấn Tìm kiếm.</p>
        </div>
    </main>
</div>

<script>
/** 1. DATABASE ĐẦY ĐỦ NỘI DUNG TỪ CODE GỐC **/
const dictionary = {
  "老": {
        hanzi: "老",
        pinyin: "lǎo",
        zhuyin: "ㄌㄠˇ",
        ipa: "lɑʊ̯²¹⁴",
        hanviet: "lão",
        badges: ["HSK 1", "TOCFL 1"],
        sections: [
            {
                type: "Tính 形容詞",
                meanings: [
                    { b: "① Lớn tuổi, trái nghĩa với “trẻ”", cn: "年紀大，與「少」相對、歲數高的狀態。", ex: "他的父母已经很老了。", py: "Tā de fùmǔ yǐjīng hěn lǎo le。", vi: "Bố mẹ anh ấy đã rất già rồi." },
                    { b: "② Lão luyện, giàu kinh nghiệm", cn: "老練的、富有經驗的：老手、老練、老江湖", ex: "他是一個很老練的外交官。", py: "Tā shì yí gè hěn lǎoliàn de wàijiāoguān。", vi: "Ông ấy là một nhà ngoại giao rất dày dạn kinh nghiệm." },
                    { b: "③ Tồn tại đã lâu", cn: "很久以前就存在的，表示長期存在的問題、故事或事物。", ex: "這是一個老問題，至今仍未解決。", py: "Zhè shì yí gè lǎo wèntí，zhìjīn réng wèi jiějué。", vi: "Đây là một vấn đề cũ, đến nay vẫn chưa được giải quyết." },
                    { b: "④ Cũ kỹ, kiểu cũ", cn: "陳舊的：老式、老套", ex: "他喜歡穿老式的衣服。", py: "Tā xǐhuān chuān lǎoshì de yīfu。", vi: "Anh ấy thích mặc quần áo kiểu cũ." },
                    { b: "⑤ Sẫm (màu)", cn: "（某些顏色）深", ex: "老藍的天空美如画。", py: "lǎo lán de tiānkōng měi rú huà。", vi: "Bầu trời màu xanh sẫm đẹp như tranh." },
                    { b: "⑥ Rau củ quá già / quá chín", cn: "（蔬菜）長得過了適口期（跟“嫩”相對）", ex: "這些黃瓜太老了，已經不能吃了。", py: "Zhèxiē huángguā tài lǎo le，yǐjīng bùnéng chī le。", vi: "Những quả dưa chuột này đã già, không ăn được nữa." },
                    { b: "⑦ Biến tính (giảm chất lượng)", cn: "（高分子化合物）變質", ex: "這批橡膠已經老化，失去了彈性。", py: "Zhè pī xiàngjiāo yǐjīng lǎohuà，shīqù le tánxìng。", vi: "Lô cao su này đã bị lão hóa, mất độ đàn hồi." },
                    { b: "⑧ Ban đầu / nguyên bản", cn: "原來的：老家、老地方、老規矩", ex: "我仍舊保持老習慣。", py: "Wǒ réngjiù bǎochí lǎo xíguàn。", vi: "Tôi vẫn giữ thói quen cũ." }
                ]
            },
            {
                type: "Danh 名詞",
                meanings: [
                    { b: "① Người lớn tuổi", cn: "年齡大的人，常用於描述老年群體。", ex: "這些老人正在公園裡鍛鍊身體。", py: "Zhèxiē lǎorén zhèngzài gōngyuán lǐ duànliàn shēntǐ。", vi: "Những người lớn tuổi đang tập thể dục trong công viên." },
                    { b: "② Cách gọi tôn kính cho người lớn tuổi", cn: "「老」用於姓氏前，表示對年長者的敬稱：劉老、于老、國之大老", ex: "謝老今年八十歲了。", py: "Xiè lǎo jīnnián bāshí suì le。", vi: "Ông Tạ năm nay 80 tuổi rồi." }
                ]
            },
            {
                type: "Động 動詞",
                meanings: [
                    { b: "Cách nói uyển chuyển, chỉ việc một người qua đời", cn: "指人去世的婉辭用法。（多指老人，必帶「了」）", ex: "他在去年夏天老了，享年八十歲。", py: "Tā zài qùnián xiàtiān lǎo le，xiǎngnián bāshí suì。", vi: "Ông ấy qua đời vào mùa hè năm ngoái, hưởng thọ 80 tuổi." }
                ]
            }
        ],
        compounds: [
            "一家老小 — NHẤT GIA LÃO TIỂU", "丁老 — ĐINH LÃO", "七老八十 — THẤT LÃO BÁT THẬP", 
            "七老八老 — THẤT LÃO BÁT LÃO", "三朝元老 — TAM TRIỀU NGUYÊN LÃO", "三老 — TAM LÃO", 
            "不伏老 — BẤT PHỤC LÃO", "不服老 — BẤT PHỤC LÃO", "不老氣 — BẤT LÃO KHÍ", 
            "不老藥 — BẤT LÃO DƯỢC", "不老長生 — BẤT LÃO TRƯỜNG SINH"
        ],
        idioms: [
            "白頭偕老 — BẠCH ĐẦU GIAI LÃO", "返老還童 — PHẢN LÃO HOÀN ĐỒNG", "老蚌生珠 — LÃO BẠNG SINH CHU", 
            "老成持重 — LÃO THÀNH TRÌ TRỌNG", "老當益壯 — LÃO ĐƯƠNG ÍCH TRÁNG", "老驥伏櫪 — LÃO KÍ PHỤC LỊCH", 
            "老奸巨猾 — LÃO GIAN CỰ HOẠT", "老馬識途 — LÃO MÃ THỨC ĐỒ", "老謀深算 — LÃO MƯU THÂM TOÁN", 
            "老氣橫秋 — LÃO KHÍ HOÀNH THU", "老生常談 — LÃO SINH THƯỜNG ĐÀM"
        ],
        synonyms: ["古 — CỔ", "長 — TRƯỜNG", "耆 — KÌ", "逝 — THỆ"],
        antonyms: ["新 — TÂN", "小 — TIỂU", "少 — THIỂU", "嫩 — NỘN"]
    },
    "便宜": {
        hanzi: "便宜", pinyin: "piányi", zhuyin: "ㄆㄧㄢˊ ㄧˊ", ipa: "pʰiɛn³⁵ i⁰", hanviet: "tiện nghi",
        badges: ["HSK 2", "TOCFL 1"],
        sections: [
            {
                type: "Tính 形容詞",
                meanings: [{ b: "① Giá thấp / rẻ", cn: "東西的價錢低，表示東西的價格低於一般水平或預期。", ex: "這件衣服很便宜，我打算買兩件。", py: "Zhè jiàn yīfu hěn piányi，wǒ dǎsuàn mǎi liǎng jiàn。", vi: "Cái áo này rất rẻ, tôi định mua hai chiếc." }]
            },
            {
                type: "Danh 名詞",
                meanings: [
                    { b: "① Lợi thế trong một khía cạnh nào đó", cn: "在某方面的優勢，表示某人 hoặc某事在某方面具有有利條件（較書面）。", ex: "他在語言能力上佔了很大的便宜。", py: "Tā zài yǔyán nénglì shàng zhàn le hěn dà de piányi。", vi: "Anh ấy có lợi thế lớn về năng lực ngôn ngữ." },
                    { b: "② Lợi ích không nên có", cn: "不應該得到或額外的利益。指不公平、不正當的好處。", ex: "他總是想佔別人的便宜。", py: "Tā zǒng shì xiǎng zhàn biérén de piányi。", vi: "Anh ta luôn muốn lợi dụng người khác." }
                ]
            },
            {
                type: "Động 動詞",
                meanings: [{ b: "Hên; hời cho; lợi cho", cn: "讓某人得到不該得到的好處，或逃避應有的懲罰。", ex: "這次便宜你了。", py: "Zhè cì piányi nǐ le。", vi: "Lần này hời cho anh rồi." }]
            }
        ],
        compounds: ["便宜貨 — TIỆN NGHI HÓA", "便宜商品 — TIỆN NGHI THƯƠNG PHẨM", "佔便宜 — CHIẾM TIỆN NGHI", "便宜他人 — TIỆN NGHI THA NHÂN"],
        synonyms: ["廉價 — LIÊM GIÁ", "省錢 — TỈNH TIỀN", "低廉 — ĐÊ LIÊM", "賤賣 — TIỆN MẠI"],
        antonyms: ["昂貴 — NGANG QUÝ", "珍貴 — TRÂN QUÝ", "值錢 — TRỊ TIỀN", "高昂 — CAO NGANG"]
    },
    "麻煩": {
        hanzi: "麻煩", pinyin: "má fan", zhuyin: "ㄇㄚˊ ㄈㄢˊ", ipa: "ma³⁵ fan³⁵", hanviet: "ma phiền",
        badges: ["HSK 3", "TOCFL 2"],
        sections: [
            {
                type: "Tính 形容詞",
                meanings: [{ b: "① Phiền phức, tốn công sức", cn: "煩瑣、費事。用於描述事情複雜、步驟多、處理起來不簡便。", ex: "這個程序太麻煩了，很多人都不願意申請。", py: "Zhège chéngxù tài máfan le，hěn duō rén dōu bù yuànyì shēnqǐng。", vi: "Quy trình này quá rắc rối, nhiều người không muốn đăng ký." }]
            },
            {
                type: "Danh 名詞",
                meanings: [{ b: "① Việc khiến người ta phiền lòng", cn: "難受，令人煩心困擾的事", ex: "他常在外胡作非為，給家裡添了不少麻煩。", py: "Tā cháng zài wài húzuò fēiwéi，gěi jiālǐ tiān le bù shǎo máfan。", vi: "Anh ta thường ở bên ngoài làm xằng làm bậy, gây không ít phiền phức cho gia đình." }]
            },
            {
                type: "Động 動詞",
                meanings: [{ b: "① Lời yêu cầu lịch sự", cn: "禮貌請求，多用于请求他人帮忙时的礼貌表达，强调自己的行為可能给對方帶來不便。", ex: "麻煩你幫我把這份文件打印一下。", py: "Máfan nǐ bāng wǒ bǎ zhè fèn wénjiàn dǎyìn yīxià。", vi: "Phiền bạn in giúp tôi tài liệu này một chút." }]
            }
        ],
        compounds: ["添麻煩 — THIÊM MA PHIỀN", "惹麻煩 — NHẠ MA PHIỀN", "找麻煩 — TRẢO MA PHIỀN", "搗麻煩 — ĐẢO MA PHIỀN"],
        synonyms: ["困難 — KHỐN NAN", "煩惱 — PHIỀN NÃO", "難處 — NAN XỨ", "費事 — PHÍ SỰ"],
        antonyms: ["容易 — DUNG DỊ", "方便 — PHƯƠNG TIỆN", "順利 — THUẬN LỢI", "便利 — TIỆN LỢI"]
    }
};

/** 2. HÀM TÌM KIẾM **/
function performSearch() {
    const input = document.getElementById('searchInput');
    const query = input.value.trim();
    const main = document.getElementById('mainContent');

    if (query === "") return;

    const data = dictionary[query];

    if (data) {
        renderContent(data);
    } else {
        main.innerHTML = `
            <div class="card">
                <div class="empty-state">
                    <h2 style="color: #ef4444;">抱歉！</h2>
                    <p>Không tìm thấy từ "<b>${query}</b>" trong dữ liệu hiện tại.</p>
                </div>
            </div>`;
    }
}

// Lắng nghe Enter
document.getElementById('searchInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') performSearch();
});

/** 3. HÀM HIỂN THỊ NỘI DUNG (CHÍNH XÁC THEO CODE CỦA BẠN) **/
function renderContent(data) {
    const main = document.getElementById('mainContent');
    
    let html = `
    <div class="card">
        <div class="wordTop">
            <div class="hanzi">
                <span class="speaker" onclick="play('${data.hanzi}')">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.85 14,18.71V20.77C18.03,19.86 21,16.28 21,12C21,7.72 18.03,4.14 14,3.23M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16.02C15.5,15.29 16.5,13.77 16.5,12M3,9V15H7L12,20V4L7,9H3Z"/></svg>
                </span>
                ${data.hanzi}
            </div>
            <div class="meta">
                <span>${data.zhuyin}</span><span>${data.pinyin}</span><span>${data.ipa}</span><span>${data.hanviet}</span>
                ${data.badges.map(b => `<span class="badge">${b}</span>`).join('')}
            </div>
            <div id="stroke-container" class="stroke-container"></div>
            <button class="btn-stroke-trigger" onclick="drawStroke('${data.hanzi}')">▶ 播放筆順 (Phát bút thuận)</button>
        </div>

        ${data.sections.map(sec => `
            <div class="section">
                <div class="sectionTitle">${sec.type}</div>
                ${sec.meanings.map(m => `
                    <div class="meaning">
                        <b>${m.b}</b>
                        <div class="cn">${m.cn}</div>
                        <div class="example">
                            <div><span class="speaker" style="font-size:20px;" onclick="play('${m.ex}')">🔊</span> ${m.ex}</div>
                            <div class="pinyin">${m.py}</div>
                            <div class="vi">→ ${m.vi}</div>
                        </div>
                    </div>
                `).join('')}
            </div>
        `).join('')}

        <div class="section">
           ${data.compounds ? `
        <div class="section">
            <div class="sectionTitle">Từ ghép 詞語搭配</div>
            <div class="wordList">
                ${data.compounds.map(t => `<div class="tag" onclick="play('${t.split(' — ')[0]}')">${t}</div>`).join('')}
            </div>
        </div>
        ` : ''}

        ${data.idioms ? `
        <div class="section">
            <div class="sectionTitle">Thành ngữ liên quan 相關成語</div>
            <div class="wordList">
                ${data.idioms.map(t => `<div class="tag" onclick="play('${t.split(' — ')[0]}')">${t}</div>`).join('')}
            </div>
        </div>
        ` : ''}

        <div class="section">
            <div class="sectionTitle">Từ cận nghĩa 近義詞</div>
            <div class="wordList">${data.synonyms.map(t => `<div class="tag" onclick="play('${t.split(' — ')[0]}')">${t}</div>`).join('')}</div>
        </div>
        <div class="section">
            <div class="sectionTitle">Từ trái nghĩa 反義詞</div>
            <div class="wordList">${data.antonyms.map(t => `<div class="tag" onclick="play('${t.split(' — ')[0]}')">${t}</div>`).join('')}</div>
        </div>
    </div>`;

    main.innerHTML = html;
    
    // Tự động chạy bút thuận ngay khi hiện từ
    setTimeout(() => drawStroke(data.hanzi), 200);
}

function play(text) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'zh-CN';
    utterance.rate = 0.8;
    window.speechSynthesis.speak(utterance);
}

function drawStroke(chars) {
    const container = document.getElementById('stroke-container');
    if(!container) return;
    container.innerHTML = ''; 
    
    chars.split('').forEach(char => {
        const div = document.createElement('div');
        div.className = 'stroke-box';
        container.appendChild(div);
        
        HanziWriter.create(div, char, {
            width: 160,
            height: 160,
            padding: 5,
            showOutline: true,
            strokeColor: '#2563eb',
            delayBetweenStrokes: 150
        }).animateCharacter();
    });
}
</script>
</body>
</html>

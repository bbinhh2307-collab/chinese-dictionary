let index=0;

function render(){
const w=words[index];

document.getElementById("word").innerHTML=`
<div class="wordBox">
<div class="hanzi">${w.char}</div>
<div class="pinyin">${w.pinyin}</div>
</div>
`;

document.getElementById("content").innerText=w.content;
}

function playAudio(){
const u=new SpeechSynthesisUtterance(words[index].char);
u.lang="zh-CN";
speechSynthesis.speak(u);
}

function next(){
index=(index+1)%words.length;
render();
}

function prev(){
index=(index-1+words.length)%words.length;
render();
}

render();
